name: Security Scan

on:
  workflow_call:
    inputs:
      fail_on:
        description: "Severidade mínima que bloqueia o merge (critical|high|medium|low)"
        type: string
        default: "high"
  push:
    branches: [main]
  pull_request:

jobs:
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Rodar Semgrep
        run: semgrep scan --config auto --sarif --output semgrep.sarif || true
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif
      - name: Publicar na aba Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca-iac-trivy:
    name: SCA + IaC + Secrets (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Rodar Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          scanners: vuln,secret,misconfig
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy
          path: trivy.sarif
      - name: Publicar na aba Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy

  secrets-gitleaks:
    name: Secrets no histórico (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: zricethezav/gitleaks:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar Gitleaks
        run: |
          gitleaks detect --source . \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 0
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-gitleaks
          path: gitleaks.sarif

  gate:
    name: Policy Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    needs: [sast-semgrep, sca-iac-trivy, secrets-gitleaks]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: k19x/ci_cd
      - uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalizar resultados
        run: python scripts/normalize.py sarif/ --output findings.json
      - name: Enviar para o dashboard
        if: always() && vars.SECPIPE_DASHBOARD_URL != ''
        continue-on-error: true
        env:
          SECPIPE_TOKEN: ${{ secrets.SECPIPE_TOKEN }}
        run: |
          python scripts/upload.py findings.json \
            --url "${{ vars.SECPIPE_DASHBOARD_URL }}" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --token "$SECPIPE_TOKEN"
      - name: Aplicar gate
        run: python scripts/gate.py findings.json --policy policy/policy.yml --fail-on "${{ inputs.fail_on || 'high' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings
          path: findings.json
