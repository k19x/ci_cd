# Política do gate de segurança.
# Usada quando o workflow NÃO passa --fail-on (que é um atalho que sobrepõe isto).

# Quantidade máxima permitida de findings ATIVOS por severidade.
# 0 = qualquer ocorrência bloqueia o merge.
max:
  critical: 0
  high: 0
  medium: 10
  low: 50

# Supressão de falsos positivos. Cada entrada pode ser:
#   - o id (fingerprint) de um finding específico, ex: "a1b2c3d4e5f60708"
#   - um rule id inteiro, ex: "python.lang.security.audit.eval-detected"
#   - um glob de arquivo, ex: "tests/**"
allowlist:
  - "tests/fixtures/**"
  # secrets: inherit é seguro aqui pois o workflow chamado é nosso próprio ci_cd (confiável)
  - "yaml.github-actions.security.secrets-inherit.secrets-inherit"
  # arquivos de workflow do caller não são código da aplicação
  - ".github/workflows/security.yml"

  # ── Handbooks de pentest ──────────────────────────────────────────────────────
  # Os arquivos em handbooks/ são documentação técnica de segurança ofensiva com
  # exemplos de código, hashes, tokens e payloads propositalmente inseguros.
  # Não representam código em execução — são referências para analistas.
  - "handbooks/**"

  # ── Scorecard: controles de governança — decisões de nível organizacional ───────
  # Branch protection, code review obrigatório e dependency update tools
  # são configurações de repositório (GitHub settings), não vulnerabilidades de código.
  # Exigem decisão org-level; não bloqueiam o gate de segurança de código.
  - "BranchProtectionID"
  - "CodeReviewID"
  - "TokenPermissionsID"
  - "DependencyUpdateToolID"
  - "VulnerabilitiesID"

  # ── Dockerfile: container de pentest roda como root por design ────────────────
  # A imagem instala e executa nmap, nuclei, sqlmap, naabu e outras ferramentas
  # que requerem raw sockets e capacidades de rede (CAP_NET_RAW, CAP_NET_ADMIN).
  # Trocar para USER não-root quebraria essas ferramentas sem passar --cap-add,
  # o que exigiria privileged mode — equivalente em risco. Risco aceito e
  # documentado: a imagem é usada apenas em ambientes de pentest controlados,
  # nunca exposta publicamente como serviço.
  - "dockerfile.security.missing-user.missing-user"
  - "DS-0002"
